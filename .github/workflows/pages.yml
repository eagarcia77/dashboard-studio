name: Deploy Dashboard Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild validated production page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat build/index.part1.b64 build/index.part2.b64 build/index.part3.b64 build/index.part4.b64 \
            | base64 --decode \
            | gunzip > _site/index.html
          echo "abf2577735b8c9987b5efc7312834b57956aacd672aba3dbca67dff486eba933  _site/index.html" | sha256sum --check --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
